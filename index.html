<!doctype html>
<html lang="fa" dir="rtl" style="background-color: #F8FAFC; color: #0F172A;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>" />
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏫</text></svg>" />
    <title>مدیریت هوشمند کلاس ششم</title>
    <meta name="description" content="سامانه هوشمند مدیریت کلاس ششم دبستان حضرت قائم (عج) شامل آمادگی تیزهوشان دولینگو، لیگ کلاسی، تکالیف، نمرات و کارنامه هوشمند" />
    <meta property="og:title" content="مدیریت هوشمند کلاس ششم" />
    <meta property="og:description" content="سامانه هوشمند مدیریت کلاس ششم دبستان حضرت قائم (عج) شامل آمادگی تیزهوشان دولینگو، لیگ کلاسی، تکالیف، نمرات و کارنامه هوشمند" />
    <meta property="og:image" content="/school-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/school-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- High-performance non-blocking font loading (avoids render-blocking white screen on cold cache) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" />
    </noscript>
    <style>
      :root {
        font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Segoe UI Persian', 'IRANSans', Tahoma, Arial, sans-serif;
      }
      netlify-drawer,
      #netlify-feedback-badge,
      div[data-netlify-deploy-id],
      a[href*="netlify.com"],
      div:has(> a[href*="netlify.com"]),
      body > div:last-child:has(a[href*="netlify.com"]) {
        display: none !important;
        position: fixed !important;
        bottom: -9999px !important;
        left: -9999px !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        max-height: 0 !important;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseBadge {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.9; }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #F8FAFC; color: #0F172A; min-height: 100vh; font-family: 'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Segoe UI Persian', Tahoma, Arial, sans-serif;">
    <div id="root" style="min-height: 100vh; background-color: #F8FAFC;">
      <!-- Instant First Paint Loader (renders in 0.05s before any external JS or font) -->
      <div id="fallback-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box;">
        <div style="width: 76px; height: 76px; border-radius: 22px; background: #EFF6FF; border: 2px solid #BFDBFE; display: flex; align-items: center; justify-content: center; font-size: 38px; margin-bottom: 16px; box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.18); animation: pulseBadge 2s ease-in-out infinite;">
          🏫
        </div>
        <h2 style="margin: 0 0 6px; font-size: 19px; font-weight: 900; color: #0F172A; letter-spacing: -0.3px;">
          مدیریت هوشمند کلاس ششم
        </h2>
        <p style="margin: 0 0 16px; font-size: 13px; color: #64748B; font-weight: 600;">
          دبستان حضرت قائم (عج)
        </p>
        <div style="width: 32px; height: 32px; border: 3px solid #E2E8F0; border-top-color: #2563EB; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <p style="margin: 14px 0 0; font-size: 11.5px; color: #94A3B8; font-weight: 500;">
          درحال آماده‌سازی کلاس درس...
        </p>
        <div id="slow-network-hint" style="display: none; margin-top: 18px; max-width: 280px; font-size: 11px; color: #B45309; background: #FEF3C7; border: 1px solid #FDE68A; padding: 8px 12px; border-radius: 10px; line-height: 1.5;">
          سرعت اینترنت شما کمی کند است. برنامه در حال بارگذاری منابع اولیه است...
        </div>
      </div>
    </div>
    <!-- Safety script: detects if connection is unusually slow and offers quick reload -->
    <script>
      setTimeout(function() {
        var hint = document.getElementById('slow-network-hint');
        if (hint && document.getElementById('fallback-splash')) {
          hint.style.display = 'block';
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
