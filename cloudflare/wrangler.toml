name = "class-nemat-darkhah-proxy"
main = "worker.js"
compatibility_date = "2025-04-01"

[vars]
# Replace with your actual Netlify site URL (without trailing slash), e.g. https://your-site.netlify.app
NETLIFY_ORIGIN = "https://YOUR-NETLIFY-SITE.netlify.app"

# Keep GEMINI_API_KEY strictly as an encrypted Worker secret (NEVER in [vars] or git):
# Run: npx wrangler secret put GEMINI_API_KEY
